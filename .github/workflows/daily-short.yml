name: Daily Stock Short

on:
  schedule:
    # 매일 오전 9:30 KST = 00:30 UTC
    - cron: "30 0 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip upload)"
        required: false
        default: "false"

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Node.js (for Remotion rendering)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -e "."

      - name: Install Claude Code CLI (news filter backend)
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: Pre-download Remotion browser
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          # YouTube OAuth2 refresh token flow (preferred)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Legacy static access token fallback (optional)
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Release assets give the rendered video a public URL for the Graph API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # News filter runs through `claude -p` on the subscription; from `claude setup-token`
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python run_live_short.py

      - name: Notify failure via Kakao
        if: failure()
        env:
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$KAKAO_ACCESS_TOKEN" ]; then
            echo "KAKAO_ACCESS_TOKEN not set; skipping notification"
            exit 0
          fi
          text=$(printf '[Stock Snap] daily-short.yml 실패\n확인: %s' "$RUN_URL")
          payload=$(jq -nc --arg text "$text" --arg url "$RUN_URL" \
            '{object_type: "text", text: $text, link: {web_url: $url}}')
          curl -sS -X POST https://kapi.kakao.com/v2/api/talk/memo/default/send \
            -H "Authorization: Bearer $KAKAO_ACCESS_TOKEN" \
            --data-urlencode "template_object=$payload"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: output/
          retention-days: 3
